
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Nikhil 💙</title>

<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff758c, #667eea);
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    overflow: hidden;
}

.card {
    background: rgba(255, 255, 255, 0.15);
    padding: 50px;
    border-radius: 25px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    max-width: 500px;
}

h1 {
    font-size: 38px;
}

p {
    font-size: 20px;
    min-height: 80px;
}

button {
    margin-top: 25px;
    padding: 14px 30px;
    border: none;
    border-radius: 30px;
    font-size: 18px;
    cursor: pointer;
    background: white;
    color: #667eea;
    transition: 0.3s;
}

button:hover {
    background: #ff4d6d;
    color: white;
}

.heart {
    position: absolute;
    color: #ff4d6d;
    font-size: 20px;
    animation: float 4s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-600px); opacity: 0; }
}
</style>
</head>

<body>

<div class="card">
    <h1>Hey Nikhil 💙</h1>
    <p id="message">Click below... I have something to say.</p>
    <button onclick="nextMessage()">Click Me 😊</button>
</div>

<script>
const messages = [
    "I know I was being silly...",
    "And I am truly sorry 🥺",
    "You mean more to me than my ego.",
    "I never want to hurt you.",
    "You are really special to me 💙",
    "I care about you more than you know.",
    "Thank you for being patient with me.",
    "Please forgive me? ❤️",
    "I promise to be better.",
    "Sending you all my love 💕"
];

let index = 0;

function nextMessage() {
    if (index < messages.length) {
        document.getElementById("message").innerText = messages[index];
        createHearts();
        index++;
    } else {
        document.getElementById("message").innerText = "Forever grateful for you, Nikhil 💙✨";
    }
}

function createHearts() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerText = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 20) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 4000);
}
</script>

</body>
</html>
