
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>I'm Sorry Nikhil 💙</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.6;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            background: white;
            color: #764ba2;
            transition: 0.3s;
        }

        button:hover {
            background: #ff6b81;
            color: white;
        }

        @keyframes fadeIn {
            from {opacity: 0; transform: translateY(20px);}
            to {opacity: 1; transform: translateY(0);}
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>I'm Truly Sorry, Nikhil 💙</h1>
        <p>
            I know I was being silly and I hurt you.<br>
            That was never my intention.<br><br>
            You mean more to me than my pride or any mistake I made.<br>
            I genuinely value you and our bond.<br><br>
            Please forgive me.
        </p>
        <button onclick="forgive()">Click If You Forgive Me 😊</button>
    </div>

    <script>
        function forgive() {
            alert("Thank you Nikhil ❤️ You really mean a lot to me!");
        }
    </script>
</body>
</html>
